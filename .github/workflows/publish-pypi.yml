# Publishes a GitHub release to PyPI with Trusted Publishing: PyPI accepts the
# upload because it comes from this workflow in this repository, so no API
# token is stored anywhere. The upload carries signed attestations that tie
# the files to this repository and commit.
#
# A manual run only builds and checks the package; it publishes nothing.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setuptools_scm reads the version from the tags
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: python -m pip install --upgrade pip build twine
    - name: Build sdist and wheel
      run: python -m build
    - name: Check distribution
      run: twine check --strict dist/*
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' && github.repository == 'shenxianpeng/atlassian-api-py'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/atlassian-api-py/
    permissions:
      id-token: write # the short-lived identity PyPI trusts; nothing else
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
