name: Cloud smoke test

# Runs the read-only checks in scripts/cloud_smoke_test.py against a live
# Atlassian Cloud test site, so a change on Atlassian's side (or ours) that
# breaks Cloud support shows up within a day.
#
# It never runs for pull requests: the site credentials are repository secrets
# and must not be readable by code from a fork.

on:
  schedule:
    - cron: "17 3 * * *" # every night at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-smoke-test
  cancel-in-progress: false

jobs:
  smoke:
    # The secrets only exist in the upstream repository.
    if: github.repository == 'shenxianpeng/atlassian-api-py'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the library from this commit
        run: python -m pip install .
      - name: Read-only checks against the live site
        env:
          ATLASSIAN_URL: ${{ secrets.ATLASSIAN_URL }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
          JIRA_ISSUE: ${{ vars.JIRA_ISSUE }}
          CONFLUENCE_SPACE: ${{ vars.CONFLUENCE_SPACE }}
          CONFLUENCE_PAGE_ID: ${{ vars.CONFLUENCE_PAGE_ID }}
          # A skipped check fails the run, so an empty site cannot pass.
          SMOKE_STRICT: "1"
        run: python scripts/cloud_smoke_test.py
